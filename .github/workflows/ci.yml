name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 必须带 [dev]：pytest 与 pytest-asyncio 都在 dev extra 里，
      # 只装 runtime 依赖的话下一步 python -m pytest 会直接失败。
      - name: Install
        run: pip install -e '.[dev]'

      - name: Fast tests
        run: python -m pytest tests/ -q -m 'not e2e'

      - name: E2E tests (sandboxed HOME)
        # e2e 会起真实子进程，因此单独一步，失败时日志更容易看
        run: python -m pytest tests/test_protocol_e2e.py -q

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  delivery:
    name: Delivery checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e 'backend/.[dev]'

      - name: Packaging, layout, README accuracy
        run: |
          python -m pytest backend/tests/test_packaging.py \
            backend/tests/test_delivery.py \
            backend/tests/test_repo_layout.py \
            backend/tests/test_readme_accuracy.py \
            backend/tests/test_install_path.py \
            backend/tests/test_suite_health.py \
            backend/tests/test_code_hygiene.py -q