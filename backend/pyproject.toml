[project]
name = "devmentor-backend"
version = "2.0.0"
description = "DevMentor agent service - terminal programming mentor with architecture review"
requires-python = ">=3.11"
dependencies = [
    "agentscope>=2.0.10",
    "pydantic>=2.0",
    # 架构分析用 tree-sitter 解析 Java 语法树。
    # agentscope 自身依赖 tree_sitter，但**不含** tree_sitter_java，
    # 必须显式声明，否则 devmentor.arch.scanner 在 import 时就失败。
    "tree-sitter>=0.23",
    "tree-sitter-java>=0.23",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devmentor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: 起真实子进程的端到端测试，较慢（用 -m 'not e2e' 跳过）",
    "slow: 构建 wheel 等耗时操作（用 -m 'not slow' 跳过）",
]

[tool.ruff]
line-length = 100
target-version = "py311"