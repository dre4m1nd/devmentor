[project]
name = "devmentor-backend"
version = "2.0.0"
description = "DevMentor agent service - a terminal programming mentor that actually runs your code"
requires-python = ">=3.11"
dependencies = [
    "agentscope>=2.0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devmentor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: 起真实子进程的端到端测试，较慢（用 -m 'not e2e' 跳过）",
    "slow: 构建 wheel 等耗时操作（用 -m 'not slow' 跳过）",
]

[tool.ruff]
line-length = 100
target-version = "py311"