[project]
name = "devmentor-backend"
version = "2.0.0"
description = "DevMentor agent service - Java programming mentor with architecture review"
requires-python = ">=3.11"
dependencies = [
    "agentscope>=2.0.10",
    "pydantic>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devmentor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: 起真实子进程的端到端测试，较慢（用 -m 'not e2e' 跳过）",
]

[tool.ruff]
line-length = 100
target-version = "py311"