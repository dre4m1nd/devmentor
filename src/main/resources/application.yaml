spring:
  application:
    name: devmentor
  main:
    web-application-type: none
    banner-mode: off
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration

logging:
  level:
    root: warn
    dre4m1nd.devmentor: info
    io.agentscope: warn

devmentor:
  # provider:model 形式。默认走 OpenRouter 的免费模型（OpenAI 兼容网关）。
  # 例：dashscope:qwen-plus / openai:gpt-4.1-mini / ollama:qwen2.5-coder
  model-id: ${DEVELOPMENT_MODEL_ID:openai:minimax/minimax-m3.1-flash:free}
  # 只从环境变量读取，绝不把密钥写进仓库。
  api-key: ${OPENROUTER_API_KEY:}
  base-url: ${DEVELOPMENT_BASE_URL:https://openrouter.ai/api/v1}
  language: zh
  user-id: ${USER:learner}
  session-id: ""
  workspace: .devmentor/workspace
  state-dir: .devmentor/state
  project-root: ""
  permission-mode: interactive
  max-iters: 24
  max-history-messages: 50
  enable-shell: false
  enable-plan-mode: true
  enable-skill-manage: true
  tools:
    java-run:
      enabled: true
      timeout-seconds: 10
      max-source-chars: 20000
  cli:
    enabled: true
